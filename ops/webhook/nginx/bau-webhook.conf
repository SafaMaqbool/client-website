# 7YRDS deploy webhook -- exact-match proxy for site `bau`.
#
# Installed to /etc/nginx/snippets/7yrds-webhook-bau.conf and included
# EXACTLY ONCE inside the TLS server block of
# /etc/nginx/sites-available/bau.conf (the HTTP redirect block is not
# touched).  Only this location is added: TLS, redirects, security
# headers, static caching, DNS and every other vhost stay unchanged.
#
# 1 MiB body cap matches the receiver's own cap; the receiver verifies the
# Bitbucket HMAC signature before any JSON parsing and answers on
# 127.0.0.1:9087 only.
location = /__deploy/hooks/bitbucket/bau {
    client_max_body_size 1m;

    proxy_pass http://127.0.0.1:9087;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
}
